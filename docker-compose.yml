version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: multiterminal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiterminal
      POSTGRES_PASSWORD: multiterminal_dev_password
      POSTGRES_DB: multiterminal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiterminal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: